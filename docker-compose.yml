version: '3.8'

services:
  effata-bot:
    build: .
    container_name: effata-bot
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'      # Max 50% di 1 CPU
          memory: 512M     # Max 512MB RAM
        reservations:
          cpus: '0.25'     # Riserva 25% CPU
          memory: 256M     # Riserva 256MB RAM
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_CHAT_ID=${ALLOWED_CHAT_ID}
      - META_PAGE_ID=${META_PAGE_ID}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      - SHARE_THANKYOU_PRIVATE=${SHARE_THANKYOU_PRIVATE}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - WORDPRESS_URL=${WORDPRESS_URL}
      - WORDPRESS_USERNAME=${WORDPRESS_USERNAME}
      - WORDPRESS_APP_PASSWORD=${WORDPRESS_APP_PASSWORD}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN}
      - LINKEDIN_ORG_ID=${LINKEDIN_ORG_ID}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - PORT=3000
    ports:
      - "3002:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"     # Max 10MB per file log
        max-file: "3"       # Mantieni ultimi 3 file
    volumes:
      # Persisti i dati anche se il container riavvia
      - ./output:/app/output
      - ./logs:/app/logs
      - ./effata.db:/app/effata.db
      # Foto caricate su Telegram in attesa di /genera: senza questo volume un
      # rebuild del container (es. deploy di una modifica al codice) le perde,
      # perché intake viveva solo nel filesystem effimero del container.
      - ./intake:/app/intake
      # Coda del materiale in attesa (pendingByChat / categoria selezionata):
      # i file video/foto stanno in ./intake, ma senza persistere anche questo
      # indice un rebuild lasciava i file orfani e /status tornava vuoto.
      - ./state.json:/app/state.json
      # Ultimo mese per cui il post di riepilogo è già stato preparato: senza
      # questo volume un rebuild lo azzerava e, se fatto nella finestra "ultimo
      # giorno del mese dalle 21" o il 1°, il riepilogo veniva rigenerato (bozze
      # doppie). Il file sull'host DEVE esistere prima di `up` (altrimenti Docker
      # ci monta una cartella): crearlo con {"lastRunMonth":"<YYYY-MM già fatto>"}.
      - ./monthly-summary-state.json:/app/monthly-summary-state.json
    networks:
      - effata-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.effata-bot.rule=Host(`bot.effataitalia.it`)"
      - "traefik.http.routers.effata-bot.entrypoints=websecure"
      - "traefik.http.routers.effata-bot.tls.certresolver=letsencrypt"
      - "traefik.http.services.effata-bot.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (res) => {if (res.statusCode !== 200) throw new Error(res.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  effata-network:
    driver: bridge
